<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer AI Reticle Brackets (Computer Vision Bounding Box) -->
  <path d="M 30 65 L 30 35 Q 30 30 35 30 L 65 30" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 135 30 L 165 30 Q 170 30 170 35 L 170 65" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 30 135 L 30 165 Q 30 170 35 170 L 65 170" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 135 170 L 165 170 Q 170 170 170 165 L 170 135" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Neural Hex Shield Frame -->
  <polygon points="100,20 165,55 165,145 100,180 35,145 35,55" stroke="url(#cyberGrad)" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.6"/>

  <!-- Circular Outer Lens Ring with Glow -->
  <circle cx="100" cy="100" r="54" stroke="url(#cyberGrad)" stroke-width="3" fill="none" filter="url(#glowFilter)" opacity="0.8"/>
  <circle cx="100" cy="100" r="54" stroke="url(#cyberGrad)" stroke-width="2.5" fill="none"/>

  <!-- Central Camera Iris Body -->
  <circle cx="100" cy="100" r="42" fill="url(#irisGrad)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Neural Synapse Connections -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.75">
    <line x1="100" y1="58" x2="128" y2="82" />
    <line x1="142" y1="100" x2="118" y2="128" />
    <line x1="100" y1="142" x2="72" y2="118" />
    <line x1="58" y1="100" x2="82" y2="72" />
  </g>

  <!-- AI Synapse Nodes -->
  <circle cx="100" cy="58" r="3" fill="#00f2fe"/>
  <circle cx="142" cy="100" r="3" fill="#3b82f6"/>
  <circle cx="100" cy="142" r="3" fill="#8b5cf6"/>
  <circle cx="58" cy="100" r="3" fill="#00f2fe"/>

  <!-- Center Glowing Optic Sensor -->
  <circle cx="100" cy="100" r="16" fill="url(#cyberGrad)"/>
  <circle cx="100" cy="100" r="7" fill="#ffffff"/>
  
  <!-- Optical Crosshair -->
  <line x1="92" y1="100" x2="108" y2="100" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="92" x2="100" y2="108" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
</svg>
