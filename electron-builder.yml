# ══════════════════════════════════════════════════════════════
#  ELECTRON-BUILDER CONFIGURATION
#  Builds a Windows .exe installer (NSIS) from the Vite dist output.
# ══════════════════════════════════════════════════════════════

appId: com.framexe.videoanalytics
productName: FrameXe
copyright: "Copyright © 2026 FrameXe"

directories:
  output: release

files:
  - "dist/**/*"
  - "electron/**/*"
  - "package.json"

win:
  target: nsis
  icon: "build/icon.ico"
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: FrameXe
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  uninstallDisplayName: "FrameXe Video Analytics"

asar: true
